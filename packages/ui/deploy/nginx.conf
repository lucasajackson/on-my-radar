# The web client as its own deployment: static files, an SPA fallback, and
# nothing else. Everything dynamic -- /api, /oauth, /mcp, /hooks, /.well-known,
# /health, and /r/* (which needs the database for its OG meta) -- is routed to
# the API by the Ingress and never reaches this process.
#
# A FULL nginx.conf rather than a conf.d drop-in, because the pod runs
# non-root (the chart's runAsNonRoot with uid 101) and stock nginx assumes
# root: the pid file and every temp path move to /tmp, which is the only
# writable surface this container needs.
#
# No config.json and no injected block: this client shares the API's origin, so
# the client's absent-config default -- same-origin relative paths -- is not a
# fallback here, it is the configuration.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  # Keep every add_header at server scope. A single location-level add_header
  # replaces the inherited set in nginx, silently dropping the browser policy.
  map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    /favicon.svg "public, max-age=86400";
    /robots.txt "public, max-age=86400";
    # The plugin zip's name carries its digest, so a URL is always the same bytes.
    ~^/agent-setup/omr-plugin-[^/]+\.zip$ "public, max-age=31536000, immutable";
  }

  # Cloudflare terminates TLS and cloudflared reaches this pod over plain http, so the visitor's own
  # scheme arrives only as `CF-Visitor: {"scheme":"http"}`. A visitor on plain http is sent to https
  # (the API does the same in packages/server/src/https-redirect.ts). A probe from inside the
  # cluster carries no such header, and /health is exempt whatever it carries.
  map "$http_cf_visitor|$uri" $cf_plain_http {
    default 0;
    '~^[^|]*"scheme"\s*:\s*"http"[^|]*\|(?!/health(/|$))' 1;
  }

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($cf_plain_http) {
      return 301 https://$host$request_uri;
    }

    # The main SPA is served here, bypassing Hono's secureHeaders middleware.
    # Keep its document policy aligned with packages/server/src/app.ts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control $cache_control;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite content-hashes everything under /assets, which is what makes a
    # year-long immutable cache correct -- same rule the API applied.
    location /assets/ {
      try_files $uri =404;
    }

    # A worker pinned for a year is a worker that cannot be replaced.
    location = /sw.js {
      try_files $uri =404;
    }

    location = /favicon.svg {
      try_files $uri =404;
    }

    location = /robots.txt {
      return 200 "User-agent: *\nDisallow: /api/\nDisallow: /oauth/\nDisallow: /hooks/\nAllow: /\n";
    }

    # Addresses that were never pages. The SPA fallback would answer each with a
    # 200 shell (a soft 404), and a crawler or agent probing them cannot tell.
    location ~ ^/(docs|llms\.txt)$ {
      return 404;
    }

    location = /health/live {
      default_type application/json;
      return 200 '{"status":"ok","role":"ui"}';
    }

    # https://onmyradar.io/agent-setup/: what a coding agent fetches to set
    # itself up (docs/AGENT_REPO.md §V2.18). Built into the bundle by the UI
    # build. A missing file is a 404, never the SPA shell -- `curl ... | node`
    # must not be handed HTML -- and each type is explicit.
    location /agent-setup/ {
      types {
        text/markdown md;
        text/javascript mjs;
        application/json json;
        application/zip zip;
      }
      default_type text/plain;
      charset utf-8;
      charset_types text/markdown text/javascript text/plain application/json;
      try_files $uri =404;
    }

    # The SPA fallback. index.html must never be cached hard, or a deploy
    # cannot land.
    location / {
      try_files $uri /index.html;
    }
  }
}
