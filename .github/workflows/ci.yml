name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onmyradar
          POSTGRES_USER: onmyradar
          POSTGRES_PASSWORD: onmyradar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onmyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A real SMTP server for the SMTP mail provider's tests (services/mail-smtp.test.ts).
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ['1025:1025', '8025:8025']
    env:
      MAILPIT_SMTP: localhost:1025
      MAILPIT_API: http://localhost:8025
      DATABASE_URL: postgres://onmyradar:onmyradar@localhost:5432/onmyradar
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      # Type-aware lint over the whole workspace needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
      # A hosted runner has fewer cores than the suites assume; fewer Postgres workers, longer waits.
      VITEST_MAX_WORKERS: '2'
      VITEST_TEST_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (the version comes from "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      # The server and UI resolve the contract's dist, so it builds first.
      - run: pnpm --filter @onmyradar/contract build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Every migration on an empty database, twice: the second run must be a no-op.
      - run: pnpm migrate
      - run: pnpm migrate

  # The Helm chart: lint, render with every values file, schema-check, and the refusals.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh charts/install-tools.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: sh charts/check.sh

  # A real install: the runtime image in a kind cluster, cold, with two app replicas.
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh charts/install-tools.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: docker build --target runtime -t onmyradar-smoke:ci .
      - run: kind create cluster --name smoke --image kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30 --wait 120s
      - run: kind load docker-image onmyradar-smoke:ci --name smoke
      - run: sh charts/smoke.sh onmyradar-smoke ci
