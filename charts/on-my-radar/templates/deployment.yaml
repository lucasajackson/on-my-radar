apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omr.fullname" . }}
  labels:
    {{- include "omr.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "omr.selector" (dict "root" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omr.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The server drains for SHUTDOWN_DRAIN_MS and stops by SHUTDOWN_TIMEOUT_MS (25s).
      terminationGracePeriodSeconds: 35
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "omr.podSecurityContext" (dict "uid" 10001) | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        {{- include "omr.waitForPostgres" . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "omr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "omr.env" . | nindent 12 }}
          envFrom:
            {{- include "omr.envFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3500
              protocol: TCP
          # Migrations run before the server listens, so a pod waiting on another's migration lock
          # looks dead for a while. The startup probe holds the other two off until it is live.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.app.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.app.startupProbe.failureThreshold }}
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          # The one that checks the database: a pod that cannot reach it leaves the Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
