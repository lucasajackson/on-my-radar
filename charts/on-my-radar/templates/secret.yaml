{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets -}}
{{- $session := required "secrets.sessionSecret is required (32 or more characters), or set existingSecret. Generate one with: openssl rand -hex 32" $s.sessionSecret -}}
{{- if lt (len $session) 32 -}}
{{- fail "secrets.sessionSecret must be at least 32 characters" -}}
{{- end -}}
{{- $db := $s.databaseUrl -}}
{{- if and (not $db) .Values.postgres.enabled -}}
{{- $db = printf "postgres://onmyradar:%s@%s:5432/onmyradar" (include "omr.postgresPassword" .) (include "omr.postgresName" .) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omr.fullname" . }}
  labels:
    {{- include "omr.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ $session | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or postgres.enabled=true, or existingSecret)" $db | quote }}
  {{- with $s.smtpUrl }}
  SMTP_URL: {{ . | quote }}
  {{- end }}
  {{- with $s.resendApiKey }}
  RESEND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $s.s3AccessKey }}
  S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.s3SecretKey }}
  S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
